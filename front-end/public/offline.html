<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Không có kết nối mạng</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Roboto, system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; color: #4f46e5; }
    p { color: #475569; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Bạn đang offline</h1>
    <p>Dữ liệu tour đã xem trước đó vẫn có thể truy cập. Khi có mạng, ứng dụng sẽ tự đồng bộ.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
